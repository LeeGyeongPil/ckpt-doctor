[project]
name = "ckpt-doctor"
version = "0.1.1"
description = "Offline diagnosis for safetensors model folders: which file is broken, why, and the command that fixes it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["safetensors", "huggingface", "checkpoint", "llm", "integrity", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/LeeGyeongPil/ckpt-doctor"
Issues = "https://github.com/LeeGyeongPil/ckpt-doctor/issues"
Changelog = "https://github.com/LeeGyeongPil/ckpt-doctor/blob/main/CHANGELOG.md"

[project.scripts]
ckpt-doctor = "ckpt_doctor.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]
crosscheck = ["safetensors==0.8.0", "numpy==2.5.5; python_full_version >= '3.12'", "numpy>=2.2,<2.3; python_full_version < '3.12'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
